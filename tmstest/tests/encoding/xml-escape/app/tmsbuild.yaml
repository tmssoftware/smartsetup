minimum required tmsbuild version: 2.1
  
application:
  id: tms.testapp
  name: Test app for xml & <escape>
  description: An example that uses &, <> and other xml-escape characters.
  
supported frameworks:
  vcl:
    ide since: delphi7
    platforms:
      - win32intel
      - win64intel
      - win64xintel
    c++ builder support: true

packages:
  - xmlencodetest: [exe, vcl]

dependencies:
  - all.installed.components: all

