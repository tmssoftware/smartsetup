# yaml-language-server: $schema=https://raw.githubusercontent.com/tmssoftware/smartsetup/refs/heads/main/tms/example-config/tmsbuild.schema.json

minimum required tmsbuild version: 2.1
  
application:
  id: tms.testapp0
  name: Test app generating from dpk
  description: We want to compile this one so we are sure all units were compiled..
  
supported frameworks:
  vcl:
    ide since: delphi7
    platforms:
      - win32intel
      - win64intel
      - win64xintel
    c++ builder support: true

packages:
  - generate_fromtest: [exe, vcl]

dependencies:
  - all.installed.components: all

